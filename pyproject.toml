[project]
name = "noice-city"
version = "0.1.0"
description = "Fully local persistent speaker training for Qwen3-TTS on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.8",
  "huggingface-hub==1.23.0",
  "mlx==0.32.0",
  "mlx-audio==0.4.5",
  "mlx-lm==0.31.3",
  "numpy==2.5.1",
  "python-multipart==0.0.31",
  "uvicorn==0.39.0",
]

[project.urls]
Repository = "https://github.com/RuhiTaj/noice-city"
Issues = "https://github.com/RuhiTaj/noice-city/issues"
Security = "https://github.com/RuhiTaj/noice-city/security"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
